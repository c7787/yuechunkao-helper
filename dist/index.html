      const qs = DB.get('questions');
      r.list.forEach(q => qs.push(q));
      DB.set('questions', qs);
      count += r.count;
      errors.push(...r.errors);
    } else if (type === 'words') {
      const ws = DB.get('words');
      content.split('\n').forEach((line, i) => {
        line = line.trim();
        if (!line) return;
        const parts = line.split(/[,，]/);
        if (parts.length < 2 || !parts[0].trim() || !parts[1].trim()) { errors.push('第 ' + (i + 1) + ' 行格式错误（需 单词,释义）'); return; }
        ws.push({ id: Date.now() + i, word: parts[0].trim(), meaning: parts[1].trim(), phonetic: (parts[2] || '').trim() });
        count++;
      });
      DB.set('words', ws);
    } else if (type === 'materials') {
      const mats = DB.get('materials');
      content.split('\n').forEach((line, i) => {
        line = line.trim();
        if (!line) return;
        const parts = line.split(/[,，|]/);
        if (parts.length < 3 || !parts[0].trim()) { errors.push('第 ' + (i + 1) + ' 行格式错误（需 名称,类型,分类）'); return; }
        mats.push({ id: Date.now() + i, name: parts[0].trim(), type: parts[1].trim(), category: parts[2].trim(), uploadTime: new Date().toISOString().split('T')[0] });
        count++;
      });
      DB.set('materials', mats);
    } else if (type === 'scoreLines') {
      const sls = DB.get('scoreLines');
      content.split('\n').forEach((line, i) => {
        line = line.trim();
        if (!line) return;
        const parts = line.split(/[,，|]/);
        if (parts.length < 7 || !parts[0].trim() || !parts[2].trim()) { errors.push('第 ' + (i + 1) + ' 行格式错误（需 年份,批次,院校,专业,分数,属性,地区）'); return; }
        sls.push({ id: Date.now() + i, year: parseInt(parts[0]), batch: parts[1].trim(), college: parts[2].trim(), major: parts[3].trim(), score: parseInt(parts[4]), property: parts[5].trim(), region: parts[6].trim() });
        count++;
      });
      DB.set('scoreLines', sls);
    }

    if (count === 0 && errors.length === 0) { App.toast('没有可导入的内容'); return; }
    App.toast('成功导入 ' + count + ' 条' + (errors.length ? '，' + errors.length + ' 条失败' : ''));
    if (errors.length) {
      resultEl.innerHTML = '<div class="card"><div class="card-title" style="color:var(--danger)">⚠️ ' + errors.length + ' 条导入失败</div>' + errors.map(e => '<div style="font-size:13px;color:var(--danger);line-height:1.6">• ' + e + '</div>').join('') + '</div>';
    } else {
      resultEl.innerHTML = '<div class="card"><div class="card-title" style="color:var(--success,#16a34a)">✅ 全部导入成功，共 ' + count + ' 条</div></div>';
    }
    if (errors.length === 0) { document.getElementById('batchContent').value = ''; }
  },

  // 解析题目：支持表格（| / Tab / 逗号）与 JSON 数组两种格式，返回 { fatal, count, errors, list }
  _parseQuestions(text) {
    const errors = [];
    const list = [];
    const trimmed = String(text || '').trim();
    if (!trimmed) return { fatal: '请先粘贴或上传题目内容', count: 0, errors, list };

    if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
      let arr;
      try { arr = JSON.parse(trimmed); } catch (e) { return { fatal: 'JSON 格式错误，请检查括号和引号', count: 0, errors, list }; }
      if (!Array.isArray(arr)) return { fatal: '请粘贴 JSON 数组（以 [ 开头 ] 结尾）', count: 0, errors, list };
      arr.forEach((q, i) => {
        if (!q || !q.subject || !q.stem || !Array.isArray(q.options) || q.options.length < 2 || q.answer == null) {
          errors.push('第 ' + (i + 1) + ' 条题目缺少必要字段（subject/stem/options/answer）'); return;
        }
        list.push({ id: Date.now() + i, subject: String(q.subject), type: q.type || '单选', category: q.category || '', stem: String(q.stem), options: q.options.map(String), answer: parseInt(q.answer), analysis: q.analysis || '', year: q.year || '2026' });
      });
      return { fatal: null, count: list.length, errors, list };
    }

    trimmed.split('\n').map(l => l.trim()).filter(l => l).forEach((line, i) => {
      if (/^(科目|题型|subject|type|题目)/i.test(line)) return; // 跳过表头
      const parts = this._splitQuestionLine(line);
      if (parts.length < 8) { errors.push('第 ' + (i + 1) + ' 行列数不足（需 科目|题型|分类|题干|选项A|选项B|选项C|选项D|答案|解析）'); return; }
      const subject = (parts[0] || '').trim();
      const type = (parts[1] || '').trim() || '单选';
      const category = (parts[2] || '').trim();
      const stem = (parts[3] || '').trim();
      const opts = [parts[4], parts[5], parts[6], parts[7]].map(s => (s || '').trim()).filter(s => s);
      const answerRaw = (parts[8] || '').trim();
      const analysis = (parts[9] || '').trim();
      const year = (parts[10] || '').trim() || '2026';
      if (!subject || !stem || opts.length < 2 || !answerRaw) { errors.push('第 ' + (i + 1) + ' 行缺少科目/题干/选项/答案'); return; }
      const ans = this._parseAnswerIndex(answerRaw, opts.length);
      if (ans == null) { errors.push('第 ' + (i + 1) + ' 行答案无法识别（应为 A/B/C/D 或 1/2/3/4）'); return; }
      list.push({ id: Date.now() + i, subject, type, category, stem, options: opts, answer: ans, analysis, year });
    });
    return { fatal: null, count: list.length, errors, list };
  },

  _splitQuestionLine(line) {
    if (line.indexOf('\t') !== -1) return line.split('\t');
    if (line.indexOf('|') !== -1) return line.split('|');
    return line.split(/[,，]/);
  },

  _parseAnswerIndex(raw, optCount) {
    const s = String(raw).trim().toUpperCase();
    const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const li = letters.indexOf(s);
    if (li >= 0 && li < optCount) return li;
    const n = parseInt(s, 10);
    if (!isNaN(n) && n >= 1 && n <= optCount) return n - 1;
    return null;
  },

  _XLSX_CDNS: [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
  ],

  _readFileText(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      let text = '';
      try {
        const buf = new Uint8Array(reader.result);
        text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
        if (text.indexOf('\uFFFD') !== -1) {
          try { text = new TextDecoder('gbk').decode(buf); } catch (e) {}
        }
      } catch (e) {
        text = String(reader.result || '');
      }
      cb(text);
    };
    reader.onerror = () => { App.toast('文件读取失败，请重试'); };
    reader.readAsArrayBuffer(file);
  },

  batchFilePicked() {
    const input = document.getElementById('batchFile');
    const file = input.files && input.files[0];
    if (!file) return;
    const name = file.name || '';
    const ext = (name.split('.').pop() || '').toLowerCase();
    const nameEl = document.getElementById('batchFileName');
    const ta = document.getElementById('batchContent');

    if (ext === 'xlsx' || ext === 'xls') {
      this._parseExcelFile(file, nameEl, ta);
      return;
    }

    nameEl.textContent = '正在读取 ' + name + ' ...';
    this._readFileText(file, (text) => {
      ta.value = text;
      nameEl.textContent = '已读取 ' + name + '（约 ' + text.split('\n').length + ' 行），可编辑后点「开始导入」';
      App.toast('文件读取成功，请确认后开始导入');
    });
  },

  _parseExcelFile(file, nameEl, ta) {
    if (window.XLSX) { this._xlsxToText(file, nameEl, ta); return; }
    nameEl.textContent = '正在加载解析组件...';
    const load = (i) => {
      if (i >= this._XLSX_CDNS.length) {
        nameEl.textContent = '';
        App.toast('Excel 解析组件加载失败（网络原因），请把表格另存为 CSV 后再上传');
        return;
      }
      const s = document.createElement('script');
      s.src = this._XLSX_CDNS[i];
      s.onload = () => this._xlsxToText(file, nameEl, ta);
      s.onerror = () => load(i + 1);
      document.head.appendChild(s);
    };
    load(0);
  },

  _xlsxToText(file, nameEl, ta) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const first = wb.SheetNames[0];
        const ws = wb.Sheets[first];
        ta.value = XLSX.utils.sheet_to_csv(ws);
        nameEl.textContent = '已读取 ' + file.name + '（表格「' + first + '」），可编辑后点「开始导入」';
        App.toast('Excel 解析成功，请确认后开始导入');
      } catch (err) {
        nameEl.textContent = '';
        App.toast('Excel 解析失败，请确认文件未损坏，或另存为 CSV 再上传');
      }
    };
    reader.onerror = () => { nameEl.textContent = ''; App.toast('文件读取失败，请重试'); };
    reader.readAsArrayBuffer(file);
  },

  _esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            <select class="form-select" id="asBatch">${['常规批','补录批'].map(b => `<option ${isEdit&&sl.batch===b?'selected':''}>${b}</option>`).join('')}</select></div>
        </div>
        <div class="form-group"><label class="form-label">院校名称</label><input class="form-input" id="asCollege" value="${isEdit?sl.college:''}"></div>
        <div class="form-group"><label class="form-label">专业名称</label><input class="form-input" id="asMajor" value="${isEdit?sl.major:''}"></div>
        <div class="form-group"><label class="form-label">录取分数线</label><input class="form-input" id="asScore" type="number" value="${isEdit?sl.score:''}"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">属性</label>
            <select class="form-select" id="asProperty">${['公办','民办'].map(p => `<option ${isEdit&&sl.property===p?'selected':''}>${p}</option>`).join('')}</select></div>
          <div class="form-group"><label class="form-label">地域</label>
            <select class="form-select" id="asRegion">${['全省','揭阳','粤东'].map(r => `<option ${isEdit&&sl.region===r?'selected':''}>${r}</option>`).join('')}</select></div>
        </div>
        <button class="btn btn-primary btn-lg" onclick="App.adminSaveScoreLine('${isEdit?sl.id:''}')">${isEdit?'保存修改':'新增'}</button>
      </div>
    `;
  },

  adminSaveScoreLine(id) {
    const year = parseInt(document.getElementById('asYear').value);
    const batch = document.getElementById('asBatch').value;
    const college = document.getElementById('asCollege').value.trim();
    const major = document.getElementById('asMajor').value.trim();
    const score = parseInt(document.getElementById('asScore').value);
    const property = document.getElementById('asProperty').value;
    const region = document.getElementById('asRegion').value;
    if (!college || !major) { App.toast('请填写完整'); return; }
    const sls = DB.get('scoreLines');
    if (id) {
      const idx = sls.findIndex(s => s.id === parseInt(id));
      if (idx >= 0) Object.assign(sls[idx], { year, batch, college, major, score, property, region });
    } else {
      sls.push({ id: Date.now(), year, batch, college, major, score, property, region });
    }
    DB.set('scoreLines', sls);
    App.toast(id ? '修改成功' : '新增成功');
    App.goBack();
  },

  adminDeleteScoreLine(id) {
    if (!confirm('确定删除？')) return;
    DB.set('scoreLines', DB.get('scoreLines').filter(s => s.id !== id));
    App.toast('删除成功');
    App.renderPage(App.currentPage);
  },

  syncEssay() {
    App.toast('🔄 正在同步素材...（模拟百度AI搜索）');
    setTimeout(() => {
      const mats = DB.get('essayMaterials');
      const newItems = [
        { id: Date.now(), type: '语文时事素材', title: '2026巴黎奥运会中国代表团创佳绩', content: '在2026年巴黎奥运会上，中国代表团取得优异成绩，展现了新时代中国体育健儿的风采。适用主题：拼搏精神、国家荣誉、青春奋斗。', date: new Date().toISOString().split('T')[0] },
        { id: Date.now()+1, type: '英语作文万能句', title: '科技与生活万能表达', content: '1. With the rapid development of technology, our lives have been greatly changed.\n2. Artificial intelligence is playing an increasingly important role in various fields.\n3. Every coin has two sides, and technology is no exception.', date: new Date().toISOString().split('T')[0] },
      ];
      // Dedup
      newItems.forEach(item => {
        if (!mats.some(m => m.title === item.title)) mats.unshift(item);
      });
      DB.set('essayMaterials', mats);
      App.toast('✅ 同步完成！新增素材已保存');
      App.renderPage(App.currentPage);
    }, 1500);
  },

  syncPolicy() {
    App.toast('🔄 正在同步政策...（模拟百度AI搜索）');
    setTimeout(() => {
      const ps = DB.get('policies');
      const newP = { id: Date.now(), title: '2027年广东省高职院校分类招生最新通知', content: '根据广东省教育考试院最新通知，2027年春季高考（依学考录取）工作安排如下：\n\n1. 学考报名时间：预计2026年11月\n2. 学考考试时间：预计2027年1月初\n3. 成绩公布：预计2027年2月\n4. 志愿填报：预计2027年3月\n5. 录取查询：预计2027年4月\n\n特别提醒：所有时间节点以广东省教育考试院官方通知为准，请考生密切关注。\n\n春考录取的学生与夏季高考录取的学生待遇完全一致，毕业证书完全相同。', date: new Date().toISOString().split('T')[0] };
      if (!ps.some(p => p.title === newP.title)) ps.unshift(newP);
      DB.set('policies', ps);
      App.toast('✅ 同步完成！新政策已保存');
      App.renderPage(App.currentPage);
    }, 1500);
  },

  adminAddEssay() {
    const type = document.getElementById('aeType').value;
    const title = document.getElementById('aeTitle').value.trim();
    const content = document.getElementById('aeContent').value.trim();
    const date = document.getElementById('aeDate').value;
    if (!title || !content) { App.toast('请填写完整'); return; }
    const mats = DB.get('essayMaterials');
    mats.unshift({ id: Date.now(), type, title, content, date });
    DB.set('essayMaterials', mats);
    App.toast('新增成功');
    App.goBack();
  },

  adminEditEssay(id) {
    const type = document.getElementById('aeTypeE').value;
    const title = document.getElementById('aeTitleE').value.trim();
    const content = document.getElementById('aeContentE').value.trim();
    const date = document.getElementById('aeDateE').value;
    if (!title || !content) { App.toast('请填写完整'); return; }
    const mats = DB.get('essayMaterials');
    const idx = mats.findIndex(m => m.id === id);
    if (idx >= 0) Object.assign(mats[idx], { type, title, content, date });
    DB.set('essayMaterials', mats);
    App.toast('修改成功');
    App.goBack();
  },

  adminDeleteEssay(id) {
    if (!confirm('确定删除？')) return;
    DB.set('essayMaterials', DB.get('essayMaterials').filter(m => m.id !== id));
    App.toast('删除成功');
    App.renderPage(App.currentPage);
  },

  adminAddPolicy() {
    const title = document.getElementById('apTitle').value.trim();
    const content = document.getElementById('apContent').value.trim();
    const date = document.getElementById('apDate').value;
    if (!title || !content) { App.toast('请填写完整'); return; }
    const ps = DB.get('policies');
    ps.unshift({ id: Date.now(), title, content, date });
    DB.set('policies', ps);
    App.toast('新增成功');
    App.goBack();
  },

  adminEditPolicy(id) {
    const title = document.getElementById('apTitleE').value.trim();
    const content = document.getElementById('apContentE').value.trim();
    const date = document.getElementById('apDateE').value;
    if (!title || !content) { App.toast('请填写完整'); return; }
    const ps = DB.get('policies');
    const idx = ps.findIndex(p => p.id === id);
    if (idx >= 0) Object.assign(ps[idx], { title, content, date });
    DB.set('policies', ps);
    App.toast('修改成功');
    App.goBack();
  },

  adminDeletePolicy(id) {
    if (!confirm('确定删除？')) return;
    DB.set('policies', DB.get('policies').filter(p => p.id !== id));
    App.toast('删除成功');
    App.renderPage(App.currentPage);
  },
};

// ===== GLOBAL FUNCTIONS =====
function switchTab(tab) { App.switchTab(tab); }
function goBack() { App.goBack(); }

// Init
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
<script type="module">
// ===== WebLLM 本地 AI 引擎加载器 =====
// 惰性加载（点击批改时才 import），多 CDN 自动切换，暴露全局 window.__loadWebLLM
let _webllmPromise = null;
window.__loadWebLLM = function () {
  if (!_webllmPromise) {
    _webllmPromise = (async () => {
      const urls = [
        'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.84/+esm',
        'https://esm.run/@mlc-ai/web-llm',
        'https://unpkg.com/@mlc-ai/web-llm@0.2.84/+esm',
      ];
      let lastErr = null;
      for (const u of urls) {
        try { return await import(u); } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('WebLLM 加载失败');
    })();
  }
  return _webllmPromise;
};
</script>
