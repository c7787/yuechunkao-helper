<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粤春考助手 - 广东春季高考备考平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #3b82f6;
  --primary-light: #eff6ff;
  --primary-dark: #1d4ed8;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.1);
  --radius: 12px;
  --radius-sm: 8px;
  --nav-height: 60px;
  --header-height: 50px;
  --transition: .25s ease;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
body::after{content:"";position:fixed;top:0;left:50%;transform:translateX(-50%);width:480px;height:100%;border-left:1px solid var(--border);border-right:1px solid var(--border);pointer-events:none;z-index:-1}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--primary);color:#fff;height:var(--header-height);display:flex;align-items:center;padding:0 16px;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.header-title{font-size:17px;font-weight:600}
.header-back{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:15px;padding:4px 0}
.header-action{font-size:14px;cursor:pointer;padding:4px 8px;border-radius:6px}
.header-action:hover{background:rgba(255,255,255,.15)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:480px;max-width:100%;height:var(--nav-height);background:var(--card);display:flex;border-top:1px solid var(--border);z-index:100;box-shadow:0 -1px 4px rgba(0,0,0,.05)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text-light);font-size:11px;gap:2px;transition:var(--transition)}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:22px;height:22px}

/* Main Content */
.main-content{padding:16px;padding-bottom:80px;min-height:calc(100vh - var(--header-height))}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px;color:var(--text)}
.card-subtitle{font-size:13px;color:var(--text-secondary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:var(--transition);text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-lg{padding:14px 28px;font-size:16px;width:100%}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-block{width:100%}

/* Form */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:var(--transition);background:var(--card);color:var(--text);font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-textarea{min-height:80px;resize:vertical}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.form-hint{font-size:12px;color:var(--text-light);margin-top:4px}

/* Tags & Badges */
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-green{background:#ecfdf5;color:var(--success)}
.tag-orange{background:#fffbeb;color:var(--warning)}
.tag-red{background:#fef2f2;color:var(--danger)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:600;background:var(--danger);color:#fff}

/* Lists */
.list-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--transition)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--primary-light);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:var(--radius-sm)}
.list-item-icon{width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px;flex-shrink:0}
.list-item-content{flex:1;min-width:0}
.list-item-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-subtitle{font-size:12px;color:var(--text-secondary);margin-top:2px}
.list-item-arrow{color:var(--text-light);flex-shrink:0}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Stat Cards */
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-value{font-size:24px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;background:#1e293b;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;animation:toastIn .3s ease;max-width:90%}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:var(--radius);width:100%;max-width:400px;padding:24px;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* Quiz */
.quiz-option{padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:10px}
.quiz-option:hover{border-color:var(--primary);background:var(--primary-light)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-light)}
.quiz-option.correct{border-color:var(--success);background:#ecfdf5}
.quiz-option.wrong{border-color:var(--danger);background:#fef2f2}
.quiz-option-marker{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.quiz-option.selected .quiz-option-marker{border-color:var(--primary);background:var(--primary);color:#fff}
.quiz-option.correct .quiz-option-marker{border-color:var(--success);background:var(--success);color:#fff}
.quiz-option.wrong .quiz-option-marker{border-color:var(--danger);background:var(--danger);color:#fff}

/* Timer */
.timer-display{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;color:var(--primary)}
.timer-subject{text-align:center;font-size:18px;font-weight:500;margin-top:4px;color:var(--text-secondary)}
.timer-warning .timer-display{color:var(--warning);animation:pulse 1s infinite}
.timer-danger .timer-display{color:var(--danger);animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:10px 16px;font-size:14px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition);white-space:nowrap}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}

/* Community */
.post-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary);font-weight:600;font-size:15px}
.post-author{font-size:14px;font-weight:500}
.post-time{font-size:12px;color:var(--text-light)}
.post-title{font-size:16px;font-weight:600;margin-bottom:6px}
.post-content{font-size:14px;color:var(--text);line-height:1.7}
.post-meta{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text-light)}

/* Page transitions */
.page{display:none}
.page.active{display:block}

/* Admin Sidebar */
.admin-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-menu-item{background:var(--card);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:var(--transition);border:1.5px solid transparent}
.admin-menu-item:hover{border-color:var(--primary);box-shadow:var(--shadow-lg)}
.admin-menu-item-icon{font-size:28px;margin-bottom:8px}
.admin-menu-item-title{font-size:14px;font-weight:500}

/* Table */
.data-table{width:100%;font-size:13px;border-collapse:collapse}
.data-table th{text-align:left;padding:8px 6px;font-weight:600;border-bottom:2px solid var(--border);color:var(--text-secondary);font-size:12px}
.data-table td{padding:8px 6px;border-bottom:1px solid var(--border)}
.data-table tr:hover{background:var(--primary-light)}

/* Chart bars */
.chart-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:6px}
.chart-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-secondary)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Search */
.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:24px;font-size:14px;background:var(--bg);transition:var(--transition)}
.search-box input:focus{outline:none;border-color:var(--primary);background:var(--card)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light)}

/* Hero button */
.hero-btn{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:18px 28px;border-radius:var(--radius);font-size:17px;font-weight:600;text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(59,130,246,.3);transition:var(--transition);border:none;width:100%;display:block}
.hero-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.4)}
.hero-btn:active{transform:translateY(0)}

/* Plan display */
.plan-phase{background:var(--primary-light);border-left:4px solid var(--primary);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:12px}
.plan-phase-title{font-size:15px;font-weight:600;color:var(--primary);margin-bottom:6px}
.plan-phase-content{font-size:13px;color:var(--text);line-height:1.8;white-space:pre-line}
.plan-table{width:100%;font-size:13px;border-collapse:collapse;margin:8px 0}
.plan-table td{padding:6px 4px;border:1px solid var(--border);font-size:12px}
.plan-table td:first-child{font-weight:500;background:#f8fafc;width:30%}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.empty-state-text{font-size:15px}

/* Section */
.section-title{font-size:16px;font-weight:600;margin:16px 0 10px;color:var(--text)}

/* Filter row */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;background:var(--bg);border:1.5px solid var(--border);transition:var(--transition)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Rank list */
.rank-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.rank-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.rank-num.gold{background:#fef3c7;color:#d97706}
.rank-num.silver{background:#f1f5f9;color:#64748b}
.rank-num.bronze{background:#fef2f2;color:#dc2626}
.rank-num.normal{background:var(--bg);color:var(--text-secondary)}

/* Answer sheet */
.answer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.answer-dot{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);transition:var(--transition)}
.answer-dot.done{background:var(--primary);color:#fff;border-color:var(--primary)}
.answer-dot.current{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.answer-dot.marked{border-color:#f59e0b;background:#fffbeb;color:#b45309}
.answer-dot.correct-dot{background:var(--success);color:#fff;border-color:var(--success)}
.answer-dot.wrong-dot{background:var(--danger);color:#fff;border-color:var(--danger)}

/* Highlight card */
.highlight-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.cd-num{display:inline-block;min-width:34px;font-variant-numeric:tabular-nums;text-align:center}
.highlight-card h3{font-size:18px;font-weight:700;color:var(--primary-dark);margin-bottom:6px}
.highlight-card p{font-size:14px;color:var(--text)}

/* Lock screen overlay */
.lock-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lock-text{font-size:15px;color:var(--text-secondary);margin-top:16px;text-align:center}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Login page */
.login-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px}
.login-logo{font-size:48px;margin-bottom:12px}
.login-title{font-size:24px;font-weight:700;color:var(--primary);margin-bottom:4px}
.login-subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:32px}

/* Progress */
.progress-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .5s ease}
</style>
</head>

      { id: 61, subject: '数学', type: '单选', category: '立体几何', stem: '正方体的体积是 8，它的棱长是？', options: ['A. 2', 'B. 4', 'C. 8', 'D. √8'], answer: 0, analysis: '正方体体积 V=a³=8，棱长 a=2。' },
      { id: 62, subject: '数学', type: '单选', category: '导数', stem: '函数 y=x² 的导数是？', options: ['A. x', 'B. 2x', 'C. 2', 'D. x²'], answer: 1, analysis: '(xⁿ)\'=n·x^(n-1)，所以 (x²)\'=2x。' },
      { id: 63, subject: '数学', type: '单选', category: '复数', stem: '复数 (1+i)+(1-i) = ?', options: ['A. 2', 'B. 2i', 'C. 0', 'D. 1'], answer: 0, analysis: '实部相加 1+1=2，虚部 i-i=0，结果为 2。' },
      { id: 64, subject: '数学', type: '单选', category: '概率', stem: '从 5 人中选 2 人参加比赛，共有多少种选法？', options: ['A. 5', 'B. 10', 'C. 20', 'D. 25'], answer: 1, analysis: '组合数 C(5,2)=5×4/2=10。' },
      { id: 65, subject: '数学', type: '单选', category: '函数', stem: '函数 f(x)=|x| 在 x=0 处？', options: ['A. 单调递增', 'B. 有极小值 0', 'C. 有极大值 0', 'D. 无定义'], answer: 1, analysis: 'f(x)=|x|≥0，x=0 时取最小值 0，即有极小值 0。' },
      { id: 66, subject: '数学', type: '单选', category: '指数对数', stem: '方程 2ˣ = 8 的解是？', options: ['A. x=2', 'B. x=3', 'C. x=4', 'D. x=1'], answer: 1, analysis: '2ˣ=8=2³，所以 x=3。' },
      { id: 67, subject: '数学', type: '单选', category: '三角函数', stem: '在三角形中，若角 A=90°，则 sinA = ?', options: ['A. 0', 'B. 1/2', 'C. 1', 'D. √3/2'], answer: 2, analysis: 'sin90°=1。' },
      { id: 68, subject: '数学', type: '单选', category: '数列', stem: '等比数列 1,3,9,27 的前 4 项和是？', options: ['A. 30', 'B. 40', 'C. 27', 'D. 36'], answer: 1, analysis: 'S₄=1+3+9+27=40。' },
      { id: 69, subject: '数学', type: '单选', category: '不等式', stem: '若 a>b，则下列一定正确的是？', options: ['A. a²>b²', 'B. a+1>b+1', 'C. a-b<0', 'D. 1/a>1/b'], answer: 1, analysis: 'a>b，两边同加 1 得 a+1>b+1；A 不一定成立，如 -1>-2 但 1<4。' },
      { id: 70, subject: '数学', type: '单选', category: '直线圆', stem: '直线 y=3x+2 与 y 轴交点的纵坐标是？', options: ['A. 2', 'B. 3', 'C. -2', 'D. 0'], answer: 0, analysis: '令 x=0，得 y=2，即截距 b=2。' },
      { id: 71, subject: '数学', type: '单选', category: '概率', stem: '抛两枚均匀硬币，两枚都正面朝上的概率是？', options: ['A. 1/2', 'B. 1/3', 'C. 1/4', 'D. 1'], answer: 2, analysis: '每枚正面概率 1/2，两枚相互独立，1/2×1/2=1/4。' },
      { id: 72, subject: '数学', type: '单选', category: '函数', stem: '函数 y=2x+3 是？', options: ['A. 奇函数', 'B. 偶函数', 'C. 单调递增函数', 'D. 单调递减函数'], answer: 2, analysis: '一次函数 y=kx+b 中 k=2>0，函数单调递增。' },
      // ===== 扩充题（语文 73-102）=====
      { id: 73, subject: '语文', type: '单选', category: '字形', stem: '下列词语书写完全正确的一项是？', options: ['A. 川流不息', 'B. 穿流不息', 'C. 川流不夕', 'D. 串流不息'], answer: 0, analysis: '"川流不息"正确，形容行人车马像水流一样连续不断。' },
      { id: 74, subject: '语文', type: '单选', category: '成语', stem: '下列成语使用正确的一项是？', options: ['A. 他做事一丝不苟，深得信任', 'B. 他考了满分，真是罪不容诛', 'C. 这幅画令人作呕，美轮美奂', 'D. 他夸大其词，令人肃然起敬'], answer: 0, analysis: '"一丝不苟"形容办事认真细致，使用正确；B、C、D 均感情色彩不当。' },
      { id: 75, subject: '语文', type: '单选', category: '成语', stem: '下列成语使用错误的一项是？', options: ['A. 春天来了，万物复苏', 'B. 他讲的故事妙趣横生', 'C. 他们狼狈为奸，共同做好事', 'D. 这个方案无懈可击'], answer: 2, analysis: '"狼狈为奸"是贬义词，指互相勾结做坏事，不能形容做好事。' },
      { id: 76, subject: '语文', type: '单选', category: '病句', stem: '下列句子没有语病的一项是？', options: ['A. 通过这次活动，使我明白了道理', 'B. 我们要养成良好习惯', 'C. 他大约十八岁左右', 'D. 避免不要犯错误'], answer: 1, analysis: 'A 主语残缺（"通过...使"），C "大约...左右"重复，D "避免不要"否定不当。' },
      { id: 77, subject: '语文', type: '单选', category: '修辞', stem: '"白发三千丈"运用了哪种修辞手法？', options: ['A. 拟人', 'B. 比喻', 'C. 夸张', 'D. 对偶'], answer: 2, analysis: '"白发三千丈"用夸大的手法极言愁绪之深，是夸张。' },
      { id: 78, subject: '语文', type: '单选', category: '修辞', stem: '"大珠小珠落玉盘"主要运用了什么修辞？', options: ['A. 拟人', 'B. 比喻', 'C. 夸张', 'D. 排比'], answer: 1, analysis: '把琵琶声比作大小珠子落在玉盘上的声音，是比喻。' },
      { id: 79, subject: '语文', type: '单选', category: '文学常识', stem: '被后人尊称为"诗圣"的唐代诗人是？', options: ['A. 李白', 'B. 杜甫', 'C. 白居易', 'D. 李商隐'], answer: 1, analysis: '杜甫被称为"诗圣"，李白被称为"诗仙"。' },
      { id: 80, subject: '语文', type: '单选', category: '文学常识', stem: '《红楼梦》的作者是？', options: ['A. 罗贯中', 'B. 施耐庵', 'C. 曹雪芹', 'D. 吴承恩'], answer: 2, analysis: '《红楼梦》作者是曹雪芹；罗贯中作《三国演义》、施耐庵作《水浒传》、吴承恩作《西游记》。' },
      { id: 81, subject: '语文', type: '单选', category: '文学常识', stem: '四大名著中描写"西天取经"故事的是？', options: ['A. 《三国演义》', 'B. 《水浒传》', 'C. 《西游记》', 'D. 《红楼梦》'], answer: 2, analysis: '《西游记》写唐僧师徒西天取经的故事。' },
      { id: 82, subject: '语文', type: '单选', category: '古诗文', stem: '"床前明月光"的下一句是？', options: ['A. 疑是地上霜', 'B. 低头思故乡', 'C. 举头望明月', 'D. 对影成三人'], answer: 0, analysis: '李白《静夜思》：床前明月光，疑是地上霜。' },
      { id: 83, subject: '语文', type: '单选', category: '古诗文', stem: '"春眠不觉晓"的下一句是？', options: ['A. 处处闻啼鸟', 'B. 夜来风雨声', 'C. 花落知多少', 'D. 处处有啼声'], answer: 0, analysis: '孟浩然《春晓》：春眠不觉晓，处处闻啼鸟。' },
      { id: 84, subject: '语文', type: '单选', category: '古诗文', stem: '"欲穷千里目"的下一句是？', options: ['A. 更上一层楼', 'B. 黄河入海流', 'C. 白日依山尽', 'D. 一览众山小'], answer: 0, analysis: '王之涣《登鹳雀楼》：欲穷千里目，更上一层楼。' },
      { id: 85, subject: '语文', type: '单选', category: '文言文', stem: '"走马观花"中"走"的意思是？', options: ['A. 行走', 'B. 奔跑', 'C. 离开', 'D. 走路'], answer: 1, analysis: '古汉语中"走"是"跑"的意思，"走马观花"指骑马奔跑着看花。' },
      { id: 86, subject: '语文', type: '单选', category: '文言文', stem: '"学而时习之"中"之"的用法是？', options: ['A. 助词"的"', 'B. 代词，指所学内容', 'C. 主谓之间取消独立性', 'D. 宾语前置标志'], answer: 1, analysis: '"学而时习之"的"之"作代词，代指学过的知识。' },
      { id: 87, subject: '语文', type: '单选', category: '古诗文', stem: '"随风潜入夜，润物细无声"描写的是？', options: ['A. 春雨', 'B. 秋风', 'C. 冬雪', 'D. 夏日雷雨'], answer: 0, analysis: '出自杜甫《春夜喜雨》，写春雨无声滋润万物。' },
      { id: 88, subject: '语文', type: '单选', category: '语言运用', stem: '下列表达得体的一项是？', options: ['A. 请人原谅说"包涵"', 'B. 请人帮助说"久仰"', 'C. 初次见面说"久违"', 'D. 送客出门说"留步"'], answer: 0, analysis: '请人原谅说"包涵"；请人帮助应说"劳驾/烦请"，初次见面说"久仰"，"久违"是久别重逢。' },
      { id: 89, subject: '语文', type: '单选', category: '病句', stem: '下列句子有语病的一项是？', options: ['A. 他学习成绩很好', 'B. 我们要发扬艰苦奋斗的精神', 'C. 夏天的广州是炎热的季节', 'D. 教室里很安静'], answer: 2, analysis: 'C 搭配不当，"广州"不是"季节"，应说"广州的夏天是炎热的季节"。' },
      { id: 90, subject: '语文', type: '单选', category: '文学常识', stem: '唐宋八大家中属于唐代的是？', options: ['A. 苏轼', 'B. 欧阳修', 'C. 韩愈', 'D. 王安石'], answer: 2, analysis: '唐宋八大家中唐代有韩愈、柳宗元，宋代有欧阳修、三苏、王安石、曾巩。' },
      { id: 91, subject: '语文', type: '单选', category: '文学常识', stem: '"温故知新"出自哪部典籍？', options: ['A. 《论语》', 'B. 《孟子》', 'C. 《庄子》', 'D. 《老子》'], answer: 0, analysis: '"温故而知新"出自《论语·为政》。' },
      { id: 92, subject: '语文', type: '单选', category: '字形', stem: '下列词语书写完全正确的一项是？', options: ['A. 再接再厉', 'B. 再接再励', 'C. 再接在厉', 'D. 再节再厉'], answer: 0, analysis: '"再接再厉"正确，"厉"为"磨砺"义，常被误写为"励"。' },
      { id: 93, subject: '语文', type: '单选', category: '修辞', stem: '"他像一座山一样坚强"运用的修辞是？', options: ['A. 拟人', 'B. 比喻', 'C. 夸张', 'D. 借代'], answer: 1, analysis: '"像一座山一样"是明喻，把"他"比作"山"。' },
      { id: 94, subject: '语文', type: '单选', category: '古诗文', stem: '"两个黄鹂鸣翠柳"的下一句是？', options: ['A. 一行白鹭上青天', 'B. 窗含西岭千秋雪', 'C. 门泊东吴万里船', 'D. 一行白鹭飞上天'], answer: 0, analysis: '杜甫《绝句》：两个黄鹂鸣翠柳，一行白鹭上青天。' },
      { id: 95, subject: '语文', type: '单选', category: '文学常识', stem: '《西游记》中孙悟空的武器是？', options: ['A. 九齿钉耙', 'B. 金箍棒', 'C. 月牙铲', 'D. 青龙偃月刀'], answer: 1, analysis: '孙悟空的兵器是如意金箍棒；九齿钉耙是猪八戒的兵器。' },
      { id: 96, subject: '语文', type: '单选', category: '语言运用', stem: '下列标点使用正确的一项是？', options: ['A. 他问："你去哪？"', 'B. 他问，"你去哪？"', 'C. "你去哪？"他说，', 'D. 他问，你去哪？'], answer: 0, analysis: '直接引语前用冒号加引号，引号内问号使用正确。' },
      { id: 97, subject: '语文', type: '单选', category: '病句', stem: '下列句子无语病的一项是？', options: ['A. 看了这部电影，使我深受教育', 'B. 能否刻苦学习，是取得好成绩的关键', 'C. 我们要养成认真学习的习惯', 'D. 这件事大概差不多完成了'], answer: 2, analysis: 'A 主语残缺，B 两面对一面，D "大概"与"差不多"重复。' },
      { id: 98, subject: '语文', type: '单选', category: '文言文', stem: '"春风又绿江南岸"中"绿"的用法是？', options: ['A. 名词', 'B. 形容词作动词', 'C. 副词', 'D. 量词'], answer: 1, analysis: '"绿"本是形容词，这里活用为动词，意为"使...变绿"，属词类活用。' },
      { id: 99, subject: '语文', type: '单选', category: '古诗文', stem: '"飞流直下三千尺"描写的是哪处景色？', options: ['A. 庐山瀑布', 'B. 黄河', 'C. 长江', 'D. 泰山'], answer: 0, analysis: '出自李白《望庐山瀑布》，描写庐山瀑布的壮观景象。' },
      { id: 100, subject: '语文', type: '单选', category: '文学常识', stem: '"但愿人长久，千里共婵娟"的作者是？', options: ['A. 李白', 'B. 杜甫', 'C. 苏轼', 'D. 辛弃疾'], answer: 2, analysis: '出自苏轼《水调歌头·明月几时有》。' },
      { id: 101, subject: '语文', type: '单选', category: '成语', stem: '下列成语感情色彩是褒义的一项是？', options: ['A. 见义勇为', 'B. 处心积虑', 'C. 狼狈为奸', 'D. 一意孤行'], answer: 0, analysis: '"见义勇为"是褒义词；B、C、D 均为贬义词。' },
      { id: 102, subject: '语文', type: '单选', category: '古诗文', stem: '"谁知盘中餐"的下一句是？', options: ['A. 粒粒皆辛苦', 'B. 汗滴禾下土', 'C. 锄禾日当午', 'D. 粒粒皆丰收'], answer: 0, analysis: '李绅《悯农》：谁知盘中餐，粒粒皆辛苦。' },
      // ===== 扩充题（英语 103-132）=====
      { id: 103, subject: '英语', type: '单选', category: '语法', stem: 'Look! The children ___ in the park.', options: ['A. play', 'B. plays', 'C. are playing', 'D. played'], answer: 2, analysis: '"Look!" 提示动作正在进行，用现在进行时 are playing。' },
      { id: 104, subject: '英语', type: '单选', category: '语法', stem: 'I ___ my homework when my friend came in.', options: ['A. do', 'B. was doing', 'C. did', 'D. am doing'], answer: 1, analysis: '"when...came in" 表示过去某时刻正在做，用过去进行时 was doing。' },
      { id: 105, subject: '英语', type: '单选', category: '语法', stem: 'The window ___ by the boy yesterday.', options: ['A. broke', 'B. was broken', 'C. is broken', 'D. has broken'], answer: 1, analysis: '窗户被打破，用被动语态；yesterday 提示过去时，was broken。' },
      { id: 106, subject: '英语', type: '单选', category: '语法', stem: 'English ___ all over the world.', options: ['A. speaks', 'B. is spoken', 'C. spoke', 'D. is speaking'], answer: 1, analysis: '英语被世界各地的人们说，用被动语态 is spoken。' },
      { id: 107, subject: '英语', type: '单选', category: '语法', stem: 'I want ___ a doctor when I grow up.', options: ['A. be', 'B. to be', 'C. being', 'D. been'], answer: 1, analysis: 'want to do sth. 想要做某事，后接不定式。' },
      { id: 108, subject: '英语', type: '单选', category: '语法', stem: 'He enjoys ___ basketball after school.', options: ['A. play', 'B. to play', 'C. playing', 'D. played'], answer: 2, analysis: 'enjoy doing sth. 喜欢做某事，后接动名词。' },
      { id: 109, subject: '英语', type: '单选', category: '语法', stem: 'This is the man ___ helped me yesterday.', options: ['A. which', 'B. who', 'C. whose', 'D. whom'], answer: 1, analysis: '先行词 the man 指人，在定语从句中作主语，用 who。' },
      { id: 110, subject: '英语', type: '单选', category: '语法', stem: 'I don\'t know ___ he will come.', options: ['A. that', 'B. whether', 'C. what', 'D. which'], answer: 1, analysis: '"我不知道他是否会来"，用 whether 表"是否"。' },
      { id: 111, subject: '英语', type: '单选', category: '语法', stem: 'I will call you ___ I arrive home.', options: ['A. until', 'B. as soon as', 'C. because', 'D. unless'], answer: 1, analysis: 'as soon as 引导时间状语从句，意为"一...就..."。' },
      { id: 112, subject: '英语', type: '单选', category: '语法', stem: 'You ___ finish your homework first.', options: ['A. can', 'B. must', 'C. may', 'D. might'], answer: 1, analysis: '"你必须先完成作业"，用 must 表"必须"。' },
      { id: 113, subject: '英语', type: '单选', category: '语法', stem: '___ I borrow your pen?', options: ['A. Must', 'B. May', 'C. Need', 'D. Should'], answer: 1, analysis: '"May I..." 表示请求允许，意为"我可以...吗"。' },
      { id: 114, subject: '英语', type: '单选', category: '语法', stem: 'If I ___ you, I would go there.', options: ['A. am', 'B. was', 'C. were', 'D. be'], answer: 2, analysis: '虚拟语气，与现在事实相反，be 动词一律用 were。' },
      { id: 115, subject: '英语', type: '单选', category: '语法', stem: 'The number of students ___ increasing.', options: ['A. are', 'B. is', 'C. were', 'D. have been'], answer: 1, analysis: '"the number of+复数名词"作主语，谓语用单数 is。' },
      { id: 116, subject: '英语', type: '单选', category: '语法', stem: 'A number of students ___ reading in the library.', options: ['A. is', 'B. are', 'C. was', 'D. has been'], answer: 1, analysis: '"a number of+复数名词"作主语，谓语用复数 are。' },
      { id: 117, subject: '英语', type: '单选', category: '词汇', stem: 'The word "ancient" means ___.', options: ['A. 现代的', 'B. 古代的', 'C. 巨大的', 'D. 快速的'], answer: 1, analysis: 'ancient 意为"古代的、古老的"。' },
      { id: 118, subject: '英语', type: '单选', category: '词汇', stem: 'She is very ___ about her exam results.', options: ['A. worried', 'B. worry', 'C. worrying', 'D. worries'], answer: 0, analysis: 'be worried about sth. 为...担心。' },
      { id: 119, subject: '英语', type: '单选', category: '交际', stem: '— Thank you very much. — ___.', options: ['A. No, thanks', 'B. You\'re welcome', 'C. Yes, please', 'D. That\'s right'], answer: 1, analysis: '回答感谢用 "You\'re welcome"（不客气）。' },
      { id: 120, subject: '英语', type: '单选', category: '交际', stem: '— Would you like some tea? — ___.', options: ['A. Yes, please', 'B. You\'re welcome', 'C. Not at all', 'D. It doesn\'t matter'], answer: 0, analysis: '"Would you like...?" 肯定回答用 "Yes, please"。' },
      { id: 121, subject: '英语', type: '单选', category: '语法', stem: 'He ___ to Beijing three times.', options: ['A. has been', 'B. went', 'C. goes', 'D. has gone'], answer: 0, analysis: '"has been to" 表示"去过"（已回来），可加次数；"has gone to" 表示"去了（还没回来）"。' },
      { id: 122, subject: '英语', type: '单选', category: '语法', stem: 'The teacher told us ___ in class.', options: ['A. not talk', 'B. not to talk', 'C. to not talk', 'D. don\'t talk'], answer: 1, analysis: 'tell sb. not to do sth. 告诉某人不要做某事。' },
      { id: 123, subject: '英语', type: '单选', category: '语法', stem: 'The book ___ cover is red is mine.', options: ['A. who', 'B. which', 'C. whose', 'D. that'], answer: 2, analysis: '先行词 book，cover 与 book 是所属关系，用 whose。' },

// 本地 key → 云端表名 + 字段映射（toRow: 本地→云端，fromRow: 云端→本地）
const CLOUD_TABLES = {
  questions:      { table: 'questions',       toRow: (it) => ({ id: it.id, subject: it.subject, type: it.type, category: it.category, stem: it.stem, options: it.options || [], answer: it.answer, analysis: it.analysis, year: it.year || '' }), fromRow: (r) => ({ id: r.id, subject: r.subject, type: r.type, category: r.category, stem: r.stem, options: r.options || [], answer: r.answer, analysis: r.analysis, year: r.year || '' }) },
  words:          { table: 'words',           toRow: (it) => ({ id: it.id, word: it.word, meaning: it.meaning, phonetic: it.phonetic || '' }), fromRow: (r) => ({ id: r.id, word: r.word, meaning: r.meaning, phonetic: r.phonetic || '' }) },
  templates:      { table: 'templates',       toRow: (it) => ({ id: it.id, subject: it.subject, category: it.category, title: it.title, content: it.content }), fromRow: (r) => ({ id: r.id, subject: r.subject, category: r.category, title: r.title, content: r.content }) },
  scoreLines:     { table: 'score_lines',     toRow: (it) => ({ id: it.id, year: it.year, batch: it.batch, college: it.college, major: it.major, score: it.score, property: it.property, region: it.region }), fromRow: (r) => ({ id: r.id, year: r.year, batch: r.batch, college: r.college, major: r.major, score: r.score, property: r.property, region: r.region }) },
  materials:      { table: 'materials',       toRow: (it) => ({ id: it.id, name: it.name, type: it.type, category: it.category, upload_time: it.uploadTime, content: it.content || '', file_url: it.url || '' }), fromRow: (r) => ({ id: r.id, name: r.name, type: r.type, category: r.category, uploadTime: r.upload_time, content: r.content || '', url: r.file_url || '' }) },
  essayMaterials: { table: 'essay_materials', toRow: (it) => ({ id: it.id, type: it.type, title: it.title, content: it.content, date: it.date }), fromRow: (r) => ({ id: r.id, type: r.type, title: r.title, content: r.content, date: r.date }) },
  policies:       { table: 'policies',        toRow: (it) => ({ id: it.id, title: it.title, content: it.content, date: it.date }), fromRow: (r) => ({ id: r.id, title: r.title, content: r.content, date: r.date }) },
  announcements:  { table: 'announcements',   toRow: (it) => ({ id: it.id, title: it.title, content: it.content, date: it.time }), fromRow: (r) => ({ title: r.title, content: r.content, time: r.date }) },
};

// 云端同步就绪标志：init 完成会话恢复与数据拉取后才置为 true，避免初始化阶段误推送
let cloudSyncReady = false;

const CloudSync = {
  _queue: Promise.resolve(),
  _enqueue(fn) {
    this._queue = this._queue.then(fn).catch((e) => console.warn('云端同步失败', e));
    return this._queue;
  },

  // 拉取单张表：云端非空则覆盖本地（数据上云）
  async pull(key) {
    if (!sb) return;
    const cfg = CLOUD_TABLES[key];
    if (!cfg) return;
    try {
      const { data, error } = await sb.from(cfg.table).select('*').order('id', { ascending: true });
      if (error || !data || !data.length) return;
      DB.set(key, data.map(cfg.fromRow));
    } catch (e) { /* 拉取失败保持本地数据 */ }
  },

  // 拉取全部公共数据（init 时调用）
  async pullAll() {
    for (const key of Object.keys(CLOUD_TABLES)) await this.pull(key);
  },

  // 推送整表：删除后重建（正确覆盖增/改/删），串行执行避免并发冲突
  push(key) {
    if (!sb || !cloudSyncReady) return Promise.resolve();
    const cfg = CLOUD_TABLES[key];
    if (!cfg) return Promise.resolve();
    return this._enqueue(async () => {
      const items = DB.get(key) || [];
      await sb.from(cfg.table).delete().neq('id', -1);
      if (items.length) {
        const rows = items.map(cfg.toRow);
        for (let i = 0; i < rows.length; i += 500) {
          await sb.from(cfg.table).insert(rows.slice(i, i + 500));
        }
      }
    });
  },
};

// ===== 个人数据云端同步（user_data 通用 JSON 表）=====
const PERSONAL_KEYS = ['studyPlan', 'errorBook', 'favorites', 'studyStats', 'exam_records', 'essayDrafts'];

const PersonalSync = {
  _queue: Promise.resolve(),
  _enqueue(fn) {
    this._queue = this._queue.then(fn).catch((e) => console.warn('个人数据同步失败', e));
    return this._queue;
  },

  // 登录后拉取当前用户的个人数据（云端覆盖本地）
  async pullAll() {
    if (!sb || !App._currentUser) return;
    const uid = App._currentUser.id;
    try {
      const { data, error } = await sb.from('user_data').select('key,data').eq('user_id', uid);
      if (error || !data) return;
      for (const row of data) {
        if (PERSONAL_KEYS.includes(row.key)) DB.set(row.key, row.data);
      }
    } catch (e) { /* 拉取失败保持本地数据 */ }
  },

  // 写入某个人数据 key（按 user_id + key 覆盖）
  push(key) {
    if (!sb || !cloudSyncReady || !App._currentUser) return Promise.resolve();
    if (!PERSONAL_KEYS.includes(key)) return Promise.resolve();
    const uid = App._currentUser.id;
    const val = DB.get(key);
    return this._enqueue(async () => {
      await sb.from('user_data').upsert(
        { user_id: uid, key, data: val, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,key' }
      );
    });
  },
};

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { this.toast('请输入正确的邮箱'); return; }
    if (password.length < 6) { this.toast('密码至少6位'); return; }
    if (password !== password2) { this.toast('两次密码不一致'); return; }
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { nickname } }
    });
    if (error) { this.toast(error.message); return; }
    if (data.user) {
      this._currentUser = data.user;
      try {
        await sb.from('profiles').insert({ id: data.user.id, username: email, nickname });
      } catch (e) { /* profiles 表可能未建，忽略 */ }
      try { await PersonalSync.pullAll(); } catch (e) {}
      // 新注册自动记住账号，下次免输入
      DB.set('rememberLogin', { email, password, remember: true });
    }
    if (data.session) {
      this.toast('注册成功，欢迎 ' + nickname);
      this.switchTab('home');
    } else {
      this.toast('注册成功！请查收邮箱完成验证后登录');
      this.navigateTo('auth-login', '登录');
    }
  },

  async logout() {
    if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
    this._currentUser = null;
    this.toast('已退出登录');
    this.switchTab('home');
  },

  // ===== COUNTDOWN =====
  getCountdown() {
    const diff = EXAM_TIME - new Date();
    if (diff <= 0) return { d: 0, h: 0, m: 0, s: 0 };
    return {
      d: Math.floor(diff / 86400000),
      h: Math.floor((diff % 86400000) / 3600000),
      m: Math.floor((diff % 3600000) / 60000),
      s: Math.floor((diff % 60000) / 1000),
    };
  },

  startCountdown() {
    this.stopCountdown();
    const update = () => {
      const el = document.getElementById('countdownDisplay');
      if (!el) { this.stopCountdown(); return; }
      const t = this.getCountdown();
      el.innerHTML = `<span class="cd-num">${t.d}</span>天 <span class="cd-num">${String(t.h).padStart(2, '0')}</span>时 <span class="cd-num">${String(t.m).padStart(2, '0')}</span>分 <span class="cd-num">${String(t.s).padStart(2, '0')}</span>秒`;
    };
    update();
    this.countdownTimer = setInterval(update, 1000);
  },

  stopCountdown() {
    if (this.countdownTimer) { clearInterval(this.countdownTimer); this.countdownTimer = null; }
  },

              ${['语文','数学','英语'].map(s => `<div class="filter-chip ${App.paperSetup.subject===s?'active':''}" onclick="App.paperPickSubject('${s}',this)">${s}</div>`).join('')}
            </div>
          </div>
          <div class="form-group"><label class="form-label">年份</label>
            <div class="filter-row" id="paperYearRow">
              <div class="filter-chip ${App.paperSetup.year==='全部'?'active':''}" onclick="App.paperPickYear('全部',this)">全部</div>
              ${years.map(y => `<div class="filter-chip ${App.paperSetup.year===y?'active':''}" onclick="App.paperPickYear('${y}',this)">${y}年</div>`).join('')}
            </div>
          </div>
          <div class="form-group"><label class="form-label">题量</label>
            <div class="filter-row" id="paperCountRow">
              ${[10,20,30,0].map((n,i) => `<div class="filter-chip ${App.paperSetup.count===n?'active':''}" onclick="App.paperPickCount(${n},this)">${n===0?'全部':n+'题'}</div>`).join('')}
            </div>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.7" id="paperPreview"></div>
          <button class="btn btn-primary btn-lg btn-block" onclick="App.startPaper()">开始考试</button>
        </div>
        <div class="card" style="cursor:pointer" onclick="App.navigateTo('exam-history','模考历史')">
          <div class="card-title">📈 模考历史</div><div class="card-subtitle">查看历次模考成绩与分数曲线</div>
        </div>
      `;
    },

    'exam-paper-taking': function () {
      const q = App.paper.questions[App.paperIndex];
      const total = App.paper.total;
      const ua = App.paperAnswers[q.id];
      const marked = App.paperMarked[q.id];
      const answered = Object.keys(App.paperAnswers).length;
      const danger = App.paperSeconds < 300;
      return `
        <div style="position:sticky;top:0;z-index:10;background:var(--bg);padding:4px 0 10px">
          <div style="display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px">
            <div style="flex:1">
              <div style="font-size:22px;font-weight:700;color:${danger?'var(--danger)':'var(--primary)'};font-variant-numeric:tabular-nums" id="paperClock">${this._fmtSec(App.paperSeconds)}</div>
              <div style="font-size:11px;color:var(--text-secondary)">${answered}/${total} 已答 · ${App.paper.subject}${App.paper.year!=='历年'?'·'+App.paper.year+'年':''}</div>
            </div>
            <button class="btn btn-sm ${marked?'btn-primary':'btn-outline'}" onclick="App.paperToggleMark()">${marked?'⚑ 已标记':'⚑ 标记'}</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px">
          <span class="tag tag-blue">${q.subject}·${q.category}</span>
          <span style="font-size:13px;color:var(--text-secondary)">第 ${App.paperIndex+1}/${total} 题</span>
        </div>
        <div class="card">
          <div style="font-size:15px;font-weight:500;line-height:1.8;margin-bottom:16px">${q.stem}</div>
          ${q.options.map((opt,i)=>`
            <div class="quiz-option ${ua===i?'selected':''}" onclick="App.paperSelectAnswer(${i})">
              <div class="quiz-option-marker">${'ABCD'[i]}</div><span>${opt.substring(3)}</span>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          ${App.paperIndex>0?'<button class="btn btn-outline btn-block" onclick="App.paperPrev()">上一题</button>':''}
          ${App.paperIndex<total-1?'<button class="btn btn-primary btn-block" onclick="App.paperNext()">下一题</button>':'<button class="btn btn-primary btn-block" onclick="App.paperSubmit()">交卷</button>'}
        </div>
        <div class="answer-grid" style="margin-top:16px">
          ${App.paper.questions.map((item,i)=>`
            <div class="answer-dot ${App.paperAnswers[item.id]!==undefined?'done':''} ${App.paperMarked[item.id]?'marked':''} ${i===App.paperIndex?'current':''}" onclick="App.paperJump(${i})">${i+1}</div>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-outline btn-block" onclick="App.paperSaveExit()">💾 保存退出</button>
          <button class="btn btn-danger btn-block" onclick="App.paperSubmit()">交卷</button>
        </div>
      `;
    },

    'exam-paper-result': function () {
      const r = App.paperResult;
      if (!r) return '<div class="empty-state"><div class="empty-state-text">暂无结果</div></div>';
      const cats = Object.keys(r.categoryStats || {});
      return `
        <div class="highlight-card" style="text-align:center">
          <div style="font-size:48px;font-weight:700;color:${r.score>=60?'var(--success)':'var(--danger)'}">${r.score}</div>
          <div style="font-size:14px;color:var(--text-secondary)">得分（百分制）</div>
          <div style="margin-top:8px;font-size:14px">✅ ${r.correct} 题 &nbsp; ❌ ${r.wrong} 题 &nbsp; ⚪ ${r.unanswered} 题未答</div>
          <div style="margin-top:4px;font-size:14px">📊 正确率 ${r.accuracy}%</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:6px">${r.subject} · ${r.year==='历年'?'历年':r.year+'年'} · ${r.date} ${r.time} · 用时 ${this._fmtSec(r.duration)}</div>
        </div>
        <div class="card"><div class="card-title">🎯 各知识点得分率</div>
          ${cats.map(c => {
            const s = r.categoryStats[c];
            const rate = s.total ? Math.round(s.correct/s.total*100) : 0;
            return `<div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:13px"><span>${c}</span><span style="color:var(--text-secondary)">${s.correct}/${s.total} · ${rate}%</span></div>
              <div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:${rate}%;background:${rate>=80?'var(--success)':rate>=60?'#f59e0b':'var(--danger)'}"></div></div>
            </div>`;
          }).join('')}
        </div>
        <div class="card"><div class="card-title">📋 答题回顾</div>
          ${r.questions.map((q,i)=>{
            const ua = r.answers[q.id];
            const correct = ua === q.answer;
            return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span class="tag ${correct?'tag-green':(ua===undefined?'tag-orange':'tag-red')}">${correct?'正确':(ua===undefined?'未答':'错误')}</span>
                <span style="font-size:12px;color:var(--text-light)">${q.subject}·${q.category}</span>
              </div>
              <div style="font-size:14px;font-weight:500;margin-bottom:4px">${i+1}. ${q.stem}</div>
              <div style="font-size:12px;color:var(--success)">✅ 正确答案：${'ABCD'[q.answer]}. ${q.options[q.answer].substring(3)}</div>
              ${!correct && ua!==undefined ? `<div style="font-size:12px;color:var(--danger)">❌ 你的答案：${'ABCD'[ua]}. ${q.options[ua].substring(3)}</div>` : ''}
              ${q.analysis ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">💡 ${q.analysis}</div>` : ''}
            </div>`;
          }).join('')}
        </div>
        <button class="btn btn-primary btn-lg" style="margin-top:12px" onclick="App.navigateTo('exam-paper-setup','套卷模考')">再来一套</button>
        <button class="btn btn-outline btn-lg" style="margin-top:8px" onclick="App.navigateTo('exam-history','模考历史')">查看历史曲线</button>
      `;
    },

    'exam-history': function () {
      const records = (DB.get('exam_records') || []).slice().sort((a,b)=> (a.ts||0) - (b.ts||0));
      if (!records.length) return '<div class="empty-state"><div class="empty-state-icon">📈</div><div class="empty-state-text">暂无模考记录，去完成一套模考吧</div></div>';
      const latest = records[records.length-1];
      const best = records.reduce((m,r)=> r.score>m.score?r:m, records[0]);
      const avg = Math.round(records.reduce((s,r)=>s+r.score,0)/records.length);
      return `
        <div class="grid-2" style="margin-bottom:12px">
          ${this._statCard('模考次数', records.length, '#3b82f6')}
          ${this._statCard('平均分', avg, '#8b5cf6')}
          ${this._statCard('最高分', best.score, '#10b981')}
          ${this._statCard('最近一次', latest.score, '#f59e0b')}
        </div>
        <div class="card"><div class="card-title">📈 分数曲线</div>
          ${this._renderScoreCurve(records)}
        </div>
        <div class="card"><div class="card-title">📋 历次记录</div>
          ${records.slice().reverse().map(r=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="width:44px;height:44px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--primary)">${r.score}</div>
              <div style="flex:1">
                <div style="font-size:14px;font-weight:500">${r.subject} · ${r.year==='历年'?'历年':r.year+'年'}</div>
                <div style="font-size:12px;color:var(--text-secondary)">${r.date} ${r.time} · 正确率 ${r.accuracy}% · ${r.correct}/${r.total} 题</div>
              </div>
            </div>`).join('')}
        </div>
      `;
    },

    // QUIZ ANSWER
    'quiz-answer': function () {
      const q = App.quizQuestions[App.quizIndex];
      const total = App.quizQuestions.length;
      const userAnswer = App.quizAnswers[q.id];
      const progress = Math.round((App.quizIndex / total) * 100);
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="tag tag-blue">${q.subject}·${q.category}</span>
          <span style="font-size:13px;color:var(--text-secondary)">${App.quizIndex+1}/${total}</span>
        </div>
        <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="card">
          <div style="font-size:15px;font-weight:500;line-height:1.8;margin-bottom:16px">${q.stem}</div>
          ${q.options.map((opt, i) => `
            <div class="quiz-option ${userAnswer===i?'selected':''}" onclick="App.selectAnswer(${i})">
              <div class="quiz-option-marker">${'ABCD'[i]}</div>
              <span>${opt.substring(3)}</span>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          ${App.quizIndex > 0 ? `<button class="btn btn-outline btn-block" onclick="App.prevQuestion()">上一题</button>` : ''}
          <button class="btn btn-primary btn-block" onclick="App.nextQuestion()" ${userAnswer===undefined?'disabled':''} style="${userAnswer===undefined?'opacity:.5':''}">
            ${App.quizIndex < total-1 ? '下一题' : '提交'}
          </button>
        </div>
        <div class="answer-grid" style="margin-top:16px">
          ${App.quizQuestions.map((item, i) => `
            <div class="answer-dot ${App.quizAnswers[item.id]!==undefined?'done':''} ${i===App.quizIndex?'current':''}" onclick="App.jumpToQuestion(${i})">${i+1}</div>`).join('')}
        </div>
      `;
    },

    // QUIZ RESULT
    'quiz-result': function () {
      const r = App.quizResult;
      const totalQ = App.quizQuestions.length;
      return `
        <div class="highlight-card" style="text-align:center">
          <div style="font-size:48px;font-weight:700;color:${r.score>=60?'var(--success)':'var(--danger)'}">${r.score}</div>
          <div style="font-size:14px;color:var(--text-secondary)">总分（${r.mode==='mock'?'150':''}分制）</div>
          <div style="margin-top:8px">✅ ${r.correct}题 &nbsp; ❌ ${r.wrong}题 &nbsp; 📊 正确率 ${Math.round(r.correct/totalQ*100)}%</div>
        </div>
        ${App.quizQuestions.map((q, i) => {
          const ua = App.quizAnswers[q.id];
          const correct = ua === q.answer;
          return `
          <div class="card">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
              <span class="tag ${correct?'tag-green':'tag-red'}">${correct?'正确':'错误'}</span>
              <span style="font-size:12px;color:var(--text-light)">${q.subject}·${q.category}</span>
            </div>
            <div style="font-size:14px;font-weight:500;margin-bottom:8px">${i+1}. ${q.stem}</div>
            <div style="font-size:13px;color:var(--success)">✅ 正确答案：${'ABCD'[q.answer]}. ${q.options[q.answer].substring(3)}</div>
            ${!correct ? `<div style="font-size:13px;color:var(--danger)">❌ 你的答案：${'ABCD'[ua]}. ${q.options[ua].substring(3)}</div>` : ''}
            <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;background:var(--bg);padding:8px;border-radius:6px">💡 ${q.analysis}</div>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn btn-sm ${DB.isFav(q.id)?'btn-primary':'btn-outline'}" onclick="App.toggleFavFromResult(${q.id},this)">${DB.isFav(q.id)?'⭐ 已收藏':'☆ 收藏'}</button>
            </div>
          </div>`;
        }).join('')}
        <button class="btn btn-primary btn-lg" style="margin-top:12px" onclick="App.goBack()">返回</button>
      `;
    },

    // ERROR BOOK
    'errors': function () {
      const errorIds = DB.get('errorBook');
      const errorQs = DB.get('questions').filter(q => errorIds.includes(q.id));
      if (!errorQs.length) return '<div class="empty-state"><div class="empty-state-icon">🎉</div><div class="empty-state-text">暂无错题，继续保持！</div></div>';
      const subjects = ['语文','数学','英语'];
      return `
        <div class="filter-row" id="errorFilter">
          <div class="filter-chip active" onclick="App.filterErrors('all',this)">全部</div>
          ${subjects.map(s => `<div class="filter-chip" onclick="App.filterErrors('${s}',this)">${s}</div>`).join('')}
        </div>
        <div id="errorList">
          ${errorQs.map(q => `
            <div class="card" style="cursor:pointer" data-subject="${q.subject}" onclick="App.navigateTo('error-redo','错题重做',${q.id})">
              <div class="card-title">${q.stem.substring(0,30)}${q.stem.length>30?'...':''}</div>
              <div class="card-subtitle"><span class="tag tag-blue">${q.subject}</span> <span class="tag tag-orange">${q.category}</span></div>
            </div>`).join('')}
        </div>
      `;
    },

    // ERROR REDO
    'error-redo': function (id) {
      const q = DB.get('questions').find(x => x.id === id);
      if (!q) return '<div class="empty-state"><div class="empty-state-text">题目不存在</div></div>';
      return `
        <div class="card">
          <span class="tag tag-red" style="margin-bottom:8px;display:inline-block">错题重做</span>
          <div style="font-size:15px;font-weight:500;line-height:1.8;margin-bottom:16px">${q.stem}</div>
          ${q.options.map((opt, i) => `
            <div class="quiz-option" onclick="App.checkErrorRedo(this,${i},${q.answer})" data-opt="${i}">
              <div class="quiz-option-marker">${'ABCD'[i]}</div>
              <span>${opt.substring(3)}</span>
            </div>`).join('')}
          <div id="errorRedoResult" style="display:none;margin-top:12px;padding:12px;background:var(--bg);border-radius:8px">
            <div id="errorRedoText" style="font-size:14px"></div>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:8px">💡 ${q.analysis}</div>
          </div>
        </div>
      `;
    },

    // FAVORITES
    'favorites': function () {
      const favIds = DB.get('favorites');
      const favQs = DB.get('questions').filter(q => favIds.includes(q.id));
      if (!favQs.length) return '<div class="empty-state"><div class="empty-state-icon">⭐</div><div class="empty-state-text">暂无收藏题目</div></div>';
      return `
        ${favQs.map(q => `
          <div class="card">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span class="tag tag-blue">${q.subject}</span>
              <span class="tag tag-orange">${q.category}</span>
              <span style="flex:1"></span>
              <button class="btn btn-sm btn-danger" onclick="App.removeFav(${q.id});App.renderPage('favorites')">取消收藏</button>
            </div>
            <div style="font-size:14px;font-weight:500;margin-bottom:4px">${q.stem}</div>
          </div>`).join('')}
      `;
    },

    // MATERIALS
    'materials': function () {
      const mats = DB.get('materials');
      const cats = ['全部','语文资料','数学资料','英语资料','真题套卷','模拟试卷','知识总结','其他'];
      return `
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索资料名称..." oninput="App.searchMaterials(this.value)">
        </div>
        <div class="filter-row" id="matFilter">
          ${cats.map((c,i) => `<div class="filter-chip ${i===0?'active':''}" onclick="App.filterMaterials('${c}',this)">${c}</div>`).join('')}
        </div>
        <div id="matList">
          ${!mats.length ? '<div class="empty-state"><div class="empty-state-icon">📂</div><div class="empty-state-text">暂无学习资料</div></div>' :
          mats.map(m => `
            <div class="card" data-cat="${m.category}" data-name="${m.name}">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:24px">${m.type==='PDF'?'📕':m.type==='Word'?'📘':m.type==='图片'?'🖼️':'📄'}</span>
                <div style="flex:1">
                  <div style="font-size:14px;font-weight:500">${m.name}</div>
                  <div style="font-size:12px;color:var(--text-secondary)">${m.category} · ${m.type} · ${m.uploadTime}</div>
                </div>
                ${(m.content || m.url) ? `<button class="btn btn-sm btn-outline" onclick="App.navigateTo('material-detail','资料详情',${m.id})">查看</button>` : ''}
                <button class="btn btn-sm btn-primary" onclick="App.downloadMaterial(${m.id})">下载</button>
              </div>
            </div>`).join('')}
        </div>
      `;
    },

    // MATERIAL DETAIL (view text content)
    'material-detail': function (id) {
      const m = DB.get('materials').find(x => x.id === id);
      if (!m) return '<div class="empty-state"><div class="empty-state-text">资料不存在</div></div>';
      const content = m.content || '';
      const url = m.url || '';
      return `
        <div class="card">
          <div class="card-title">${m.name}</div>
          <div class="card-subtitle">${m.category} · ${m.type} · ${m.uploadTime}</div>
          ${url ? `<div style="margin:12px 0"><a class="btn btn-primary btn-block" href="${url}" target="_blank" rel="noopener">📥 打开下载链接</a></div>` : ''}
          ${content ? `<div style="font-size:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word">${this._esc(content)}</div>` : '<div class="empty-state-text" style="margin:12px 0">该资料暂无文本内容，可点击下方「下载文件」</div>'}
          <button class="btn btn-outline btn-block" style="margin-top:14px" onclick="App.downloadMaterial(${m.id})">📥 下载文件</button>
        </div>
      `;
    },

    // STUDY STATS
    'stats': function () {
      const stats = DB.get('studyStats');
      const total = stats.totalQuestions;
      return `
        <div style="display:none" id="statsPage"></div>
        <div class="section-title">📊 学习数据统计</div>
        <div class="grid-2">
          ${this._statCard('刷题总数', total, '#3b82f6')}
          ${this._statCard('正确率', `${total ? Math.round(stats.correctQuestions/total*100) : 0}%`, '#10b981')}
          ${this._statCard('错题数量', DB.get('errorBook').length, '#ef4444')}
          ${this._statCard('连续打卡', `${stats.streak}天`, '#f59e0b')}
        </div>
        <div class="card" style="margin-top:12px">
          <div class="card-title">各科目正确率</div>
          ${['语文','数学','英语'].map(s => {
            const ss = stats.subjectStats[s];
            const rate = ss.total ? Math.round(ss.correct/ss.total*100) : 0;
            return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${s}</span><span>${ss.correct}/${ss.total} (${rate}%)</span></div><div class="chart-bar"><div class="chart-bar-fill" style="width:${rate}%;background:${rate>=70?'#10b981':rate>=50?'#f59e0b':'#ef4444'}"></div></div></div>`;
          }).join('')}
        </div>
        <div class="card" style="cursor:pointer;border-left:4px solid var(--danger)" onclick="App.navigateTo('weak-points','薄弱知识点诊断')">
          <div class="card-title">🎯 薄弱知识点诊断</div>
          <div class="card-subtitle">按正确率排序定位薄弱环节，点击知识点即可专项训练</div>
        </div>
        <div class="card">
          <div class="card-title">📚 单词学习进度</div>
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>已学</span><span>${stats.wordProgress.learned}/${stats.wordProgress.total}</span></div>
          <div class="chart-bar" style="height:10px"><div class="chart-bar-fill" style="width:${Math.round(stats.wordProgress.learned/stats.wordProgress.total*100)}%;background:var(--primary)"></div></div>
        </div>
      `;
    },

    // WEAK POINTS DIAGNOSIS
    'weak-points': function () {
      const stats = DB.get('studyStats');
      const cs = stats.categoryStats || {};
      const errorBook = DB.get('errorBook') || [];
      // 错题本中每个知识点的未订正题数
      const errByCat = {};
      errorBook.forEach(id => {
        const q = DB.get('questions').find(x => x.id === id);
        if (q) { const c = q.category || '其他'; errByCat[c] = (errByCat[c] || 0) + 1; }
      });
      let items = Object.entries(cs).map(([cat, s]) => ({
        cat, subject: s.subject || '', total: s.total || 0, correct: s.correct || 0,
        wrong: (s.total || 0) - (s.correct || 0),
        accuracy: s.total ? Math.round(s.correct / s.total * 100) : 0,
        inError: errByCat[cat] || 0,
      }));
      items = items.filter(it => it.total > 0);
      items.sort((a, b) => a.accuracy - b.accuracy || b.wrong - a.wrong || b.total - a.total);
      if (!items.length) {
        return `<div class="empty-state"><div class="empty-state-icon">🎯</div><div class="empty-state-text">暂无做题数据，先去刷题或做一套模考吧</div><div class="empty-state-sub"><button class="btn btn-primary btn-sm" onclick="App.navigateTo('exam-paper-setup','套卷模考')">去做一套模考</button></div></div>`;
      }
      return `
        <div class="card"><div class="card-title">🎯 薄弱知识点诊断</div><div class="card-subtitle">按正确率排序，越靠前越薄弱，点击卡片立即专项训练</div></div>
        ${items.map((it, i) => {
          const color = it.accuracy >= 80 ? 'var(--success)' : it.accuracy >= 60 ? '#f59e0b' : 'var(--danger)';
          const rankBg = i === 0 ? 'var(--danger)' : i < 3 ? '#f59e0b' : 'var(--bg2)';
          const rankColor = i < 3 ? '#fff' : 'var(--text)';
          return `
          <div class="card" style="cursor:pointer" onclick="App.trainWeakPoint('${it.subject}','${it.cat}')">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:34px;height:34px;border-radius:50%;background:${rankBg};color:${rankColor};display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${i+1}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:500">${it.cat} <span class="tag tag-blue">${it.subject}</span>${it.inError ? ` <span class="tag tag-red">错题本${it.inError}题</span>` : ''}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">共 ${it.total} 题 · 错 ${it.wrong} 题 · 正确率 ${it.accuracy}%</div>
              </div>
              <div style="width:60px;text-align:center;flex-shrink:0">
                <div style="font-size:20px;font-weight:700;color:${color}">${it.accuracy}%</div>
                <div style="font-size:10px;color:var(--text-secondary)">正确率</div>
              </div>
            </div>
            <div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${it.accuracy}%;background:${color}"></div></div>
          </div>`;
        }).join('')}
        <div class="card" style="background:var(--primary-light);border:none"><div class="card-subtitle">💡 建议优先攻克正确率最低的知识点，点击卡片即可开始该知识点的全部题目专项训练。</div></div>

    'words-game': function () {
      const g = App.wordGame;
      if (!g || !g.words.length) return '<div class="empty-state"><div class="empty-state-icon">📚</div><div class="empty-state-text">闯关未开始</div></div>';
      const current = g.words[g.index];
      const question = g.mode === 'challenge' ? current.word : current.meaning;
      const correctText = g.mode === 'challenge' ? current.meaning : current.word;
      const distractors = g.words.filter(w => w.id !== current.id).slice(0, 3)
        .map(w => g.mode === 'challenge' ? w.meaning : w.word);
      const options = [correctText, ...distractors].sort(() => Math.random() - 0.5);
      const correctIndex = options.indexOf(correctText);
      return `
        <div class="card" style="text-align:center">
          <div class="card-subtitle">${g.mode === 'challenge' ? '看单词选词义' : '看词义选单词'}</div>

          <div style="font-size:13px;color:var(--text-light);margin-bottom:16px">${g.index + 1} / ${g.words.length}</div>
          ${options.map((o, i) => `
            <div class="quiz-option" onclick="App.checkWordAnswer(this,${i},${correctIndex})">
              <div class="quiz-option-marker">${'ABCD'[i]}</div>

        </div>
      `;
    },

      const g = App.wordGame;
      if (!g) return '<div class="empty-state"><div class="empty-state-text">暂无结果</div></div>';

      const correct = g.correct || 0;
      const rate = total ? Math.round(correct / total * 100) : 0;
      const color = rate >= 80 ? 'var(--success)' : rate >= 60 ? 'var(--warning)' : 'var(--danger)';
      return `
        <div class="highlight-card" style="text-align:center">
          <div style="font-size:40px;font-weight:700;color:${color}">${correct} / ${total}</div>
          <div style="font-size:14px;color:var(--text-secondary)">答对单词数</div>
          <div style="margin-top:8px;font-size:20px;font-weight:700;color:${color}">正确率 ${rate}%</div>

  _statCard(label, value, color) {

  // 记录某个知识点（category）的做题统计到 studyStats.categoryStats
  _recordCategory(stats, q, isCorrect) {
    if (!stats.categoryStats) stats.categoryStats = {};
    const cat = q.category || '其他';
    if (!stats.categoryStats[cat]) stats.categoryStats[cat] = { subject: q.subject, total: 0, correct: 0 };
    stats.categoryStats[cat].total++;
    if (isCorrect) stats.categoryStats[cat].correct++;
  },

  trainWeakPoint(subject, category) {
    App.startQuiz('special', subject, category);
  },

  _planPhase(title, content, color) {
    return `<div class="plan-phase" style="border-left-color:${color}">
      <div class="plan-phase-title" style="color:${color}">${title}</div>
      <div class="plan-phase-content">${content}</div></div>`;
  },

  // ===== QUIZ LOGIC =====
  startQuiz(mode, subject, category) {
    let questions = DB.get('questions');
    if (mode === 'special') {
      questions = questions.filter(q => q.subject === subject && (category === 'all' || q.category === category));
    } else if (mode === 'mock') {
      questions = questions.filter(q => q.subject === subject);
    } else if (mode === 'error-paper') {
      const errorIds = DB.get('errorBook');
      questions = questions.filter(q => errorIds.includes(q.id));
    }
    questions = questions.sort(() => Math.random() - 0.5);
    if (!questions.length) { App.toast('暂无题目'); return; }
    App.quizMode = mode;
    App.quizQuestions = questions;
    App.quizIndex = 0;
    App.quizAnswers = {};
    App.quizResult = null;
    App.navigateTo('quiz-answer', mode === 'mock' ? '全真模拟' : '答题');
  },

  selectAnswer(idx) {
    App.quizAnswers[App.quizQuestions[App.quizIndex].id] = idx;
    App.renderPage('quiz-answer');
  },

  nextQuestion() {
    if (App.quizIndex < App.quizQuestions.length - 1) {
      App.quizIndex++;
      App.renderPage('quiz-answer');
    } else {
      App.submitQuiz();
    }
  },

  prevQuestion() {
    if (App.quizIndex > 0) { App.quizIndex--; App.renderPage('quiz-answer'); }
  },

  jumpToQuestion(idx) {
    App.quizIndex = idx;
    App.renderPage('quiz-answer');
  },

  submitQuiz() {
    let correct = 0, wrong = 0;
    App.quizQuestions.forEach(q => {
      if (App.quizAnswers[q.id] === q.answer) { correct++; }
      else { wrong++; DB.addError(q.id); }
    });
    const total = App.quizQuestions.length;
    const score = App.quizMode === 'mock' ? Math.round(correct / total * 150) : Math.round(correct / total * 100);
    App.quizResult = { correct, wrong, score, mode: App.quizMode };
    // Update stats
    const stats = DB.get('studyStats');
    stats.totalQuestions += total;
    stats.correctQuestions += correct;
    App.quizQuestions.forEach(q => {
      if (!stats.subjectStats[q.subject]) stats.subjectStats[q.subject] = { total: 0, correct: 0 };
      stats.subjectStats[q.subject].total++;
      const isC = App.quizAnswers[q.id] === q.answer;
      if (isC) stats.subjectStats[q.subject].correct++;
      App._recordCategory(stats, q, isC);
    });
    DB.set('studyStats', stats);
    App.navigateTo('quiz-result', '答题结果');
  },

  toggleFavFromResult(qId, btn) {
    const isFav = DB.toggleFav(qId);
    btn.textContent = isFav ? '⭐ 已收藏' : '☆ 收藏';
    btn.className = 'btn btn-sm ' + (isFav ? 'btn-primary' : 'btn-outline');
  },

  // ===== 套卷模考 LOGIC =====
  _fmtSec(s) {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  },

  paperPickSubject(s, el) {
    App.paperSetup.subject = s;
    document.querySelectorAll('#paperSubjectRow .filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this.updatePaperPreview();
  },

  paperPickYear(y, el) {
    App.paperSetup.year = y;
    document.querySelectorAll('#paperYearRow .filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this.updatePaperPreview();
  },

  paperPickCount(n, el) {
    App.paperSetup.count = n;
    document.querySelectorAll('#paperCountRow .filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    this.updatePaperPreview();
  },

  updatePaperPreview() {
    const el = document.getElementById('paperPreview');
    if (!el) return;
    const s = App.paperSetup;
    if (!s.subject) { el.textContent = '请先选择科目'; return; }
    let pool = DB.get('questions').filter(q => q.subject === s.subject);
    if (s.year !== '全部') pool = pool.filter(q => q.year === s.year);
    if (!pool.length) { el.textContent = '⚠️ 该科目' + (s.year !== '全部' ? '·' + s.year + '年' : '') + '暂无题目'; return; }
    const count = s.count === 0 ? pool.length : Math.min(s.count, pool.length);
    const minutes = Math.max(15, Math.round(count * 1.5));
    el.textContent = `共 ${pool.length} 题可选，本次抽取 ${count} 题，考试时长约 ${minutes} 分钟`;
  },

  startPaper() {
    const s = App.paperSetup;
    if (!s.subject) { App.toast('请先选择科目'); return; }
    let pool = DB.get('questions').filter(q => q.subject === s.subject);
    if (s.year !== '全部') pool = pool.filter(q => q.year === s.year);
    if (!pool.length) { App.toast('该科目' + (s.year !== '全部' ? '·' + s.year + '年' : '') + '暂无题目'); return; }
    pool = pool.slice().sort(() => Math.random() - 0.5);
    const count = s.count === 0 ? pool.length : Math.min(s.count, pool.length);
    const questions = pool.slice(0, count);
    const seconds = Math.max(15, Math.round(count * 1.5)) * 60;
    App.paper = { subject: s.subject, year: s.year === '全部' ? '历年' : s.year, questions, total: questions.length };
    App.paperAnswers = {};
    App.paperMarked = {};
    App.paperIndex = 0;
    App.paperSeconds = seconds;
    App.paperTotalSeconds = seconds;
    App.paperStartAt = Date.now();
    App.paperResult = null;
    this._clearPaperDraft();
    this.startPaperTimer();
    App.navigateTo('exam-paper-taking', '套卷模考');
  },

  resumePaper() {
    const d = this._getPaperDraft();
    if (!d) { App.toast('没有可继续的模考'); return; }
    App.paper = { subject: d.subject, year: d.year, questions: d.questions, total: d.questions.length };
    App.paperAnswers = d.answers || {};
    App.paperMarked = d.marked || {};
    App.paperIndex = d.index || 0;
    App.paperSeconds = d.seconds;
    App.paperTotalSeconds = d.totalSeconds;
    App.paperStartAt = Date.now() - ((d.totalSeconds - d.seconds) * 1000);
    App.paperResult = null;
    this.startPaperTimer();
    App.navigateTo('exam-paper-taking', '套卷模考');
  },

  startPaperTimer() {
    this.stopPaperTimer();
    App.paperTimer = setInterval(() => {
      App.paperSeconds--;
      const el = document.getElementById('paperClock');
      if (el) {
        el.textContent = App._fmtSec(App.paperSeconds);
        el.style.color = App.paperSeconds < 300 ? 'var(--danger)' : 'var(--primary)';
      }
      if (App.paperSeconds <= 0) { App.paperSubmit(); }
    }, 1000);
  },

  stopPaperTimer() {
    if (App.paperTimer) { clearInterval(App.paperTimer); App.paperTimer = null; }
  },

  paperSelectAnswer(idx) {
    const q = App.paper.questions[App.paperIndex];
    App.paperAnswers[q.id] = idx;
    App.renderPage('exam-paper-taking');
  },

  paperToggleMark() {
    const q = App.paper.questions[App.paperIndex];
    if (App.paperMarked[q.id]) { delete App.paperMarked[q.id]; } else { App.paperMarked[q.id] = true; }
    App.renderPage('exam-paper-taking');
  },

  paperPrev() { if (App.paperIndex > 0) { App.paperIndex--; App.renderPage('exam-paper-taking'); } },
  paperNext() {
    if (App.paperIndex < App.paper.total - 1) { App.paperIndex++; App.renderPage('exam-paper-taking'); }
  },
  paperJump(idx) { App.paperIndex = idx; App.renderPage('exam-paper-taking'); },

  paperSaveExit() {
    this._savePaperDraft();
    this.stopPaperTimer();
    App.toast('已保存进度，可随时继续');
    App.goBack();
  },

  _paperDraftKey() { return 'yck_paper_draft'; },
  _savePaperDraft() {
    if (!App.paper) return;
    try {
      localStorage.setItem(this._paperDraftKey(), JSON.stringify({
        subject: App.paper.subject, year: App.paper.year, questions: App.paper.questions,
        answers: App.paperAnswers, marked: App.paperMarked, index: App.paperIndex,
        seconds: App.paperSeconds, totalSeconds: App.paperTotalSeconds,
      }));
    } catch (e) {}
  },
  _getPaperDraft() {
    try { return JSON.parse(localStorage.getItem(this._paperDraftKey()) || 'null'); } catch (e) { return null; }
  },
  _clearPaperDraft() {
    try { localStorage.removeItem(this._paperDraftKey()); } catch (e) {}
  },

  _paperLeaveGuard() {
    if (this.currentPage === 'exam-paper-taking' && this.paper) {
      this._savePaperDraft();
      this.stopPaperTimer();
    }
  },

  paperSubmit() {
    if (!App.paper) return;
    this.stopPaperTimer();
    const total = App.paper.total;
    let correct = 0, wrong = 0, unanswered = 0;
    const categoryStats = {};
    App.paper.questions.forEach(q => {
      const ua = App.paperAnswers[q.id];
      const c = q.category || '其他';
      if (!categoryStats[c]) categoryStats[c] = { total: 0, correct: 0 };
      categoryStats[c].total++;
      if (ua === undefined) { unanswered++; }
      else if (ua === q.answer) { correct++; categoryStats[c].correct++; }
      else { wrong++; DB.addError(q.id); }
    });
    const answered = correct + wrong;
    const score = Math.round(correct / total * 100);
    const accuracy = answered ? Math.round(correct / answered * 100) : 0;
    const duration = Math.round((Date.now() - App.paperStartAt) / 1000);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const record = {
      ts: Date.now(),
      subject: App.paper.subject,
      year: App.paper.year,
      date: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,
      time: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
      total, correct, wrong, unanswered,
      score, accuracy, duration,
      categoryStats,
    };
    const records = DB.get('exam_records') || [];
    records.push(record);
    DB.set('exam_records', records);
    // 同步学习统计
    const stats = DB.get('studyStats');
    stats.totalQuestions += total;
    stats.correctQuestions += correct;
    App.paper.questions.forEach(q => {
      App._recordCategory(stats, q, App.paperAnswers[q.id] === q.answer);
    });
    DB.set('studyStats', stats);
    App.paperResult = { ...record, questions: App.paper.questions, answers: App.paperAnswers };
    App.paper = null;
    this._clearPaperDraft();
    App.navigateTo('exam-paper-result', '模考结果');
  },

  _renderScoreCurve(records) {
    if (!records || records.length < 2) return '<div class="empty-state-text">至少需要 2 次模考记录才能绘制曲线</div>';
    const W = 660, H = 220, padL = 40, padR = 16, padT = 16, padB = 40;
    const scores = records.map(r => r.score);
    const lo = Math.max(0, Math.floor((Math.min(...scores) - 10) / 10) * 10);
    const hi = Math.min(100, Math.ceil((Math.max(...scores) + 10) / 10) * 10);
    const span = (hi - lo) || 1;
    const n = records.length;
    const x = i => padL + (n === 1 ? 0 : (W - padL - padR) * i / (n - 1));
    const y = s => padT + (H - padT - padB) * (1 - (s - lo) / span);
    let grid = '';
    for (let g = lo; g <= hi; g += 10) {
      const gy = y(g).toFixed(1);
      grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" style="stroke:var(--border)" stroke-dasharray="3,3"/>`;
      grid += `<text x="${padL - 6}" y="${gy}" font-size="11" style="fill:var(--text-secondary)" text-anchor="end" dominant-baseline="middle">${g}</text>`;
    }
    const pts = records.map((r, i) => `${x(i).toFixed(1)},${y(r.score).toFixed(1)}`).join(' ');
    const dots = records.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.score).toFixed(1)}" r="4" fill="#3b82f6"><title>${r.date} ${r.subject}：${r.score}分</title></circle>`).join('');
    const labels = records.map((r, i) => `<text x="${x(i).toFixed(1)}" y="${H - 16}" font-size="10" style="fill:var(--text-secondary)" text-anchor="middle">${r.date.slice(5)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}<polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;
  },

  // ===== AI 作文批改（WebLLM 本地推理）=====
  _aiLast: null,

  async essayAiGrade() {
    const ta = document.getElementById('aiEssay');
    const essay = (ta ? ta.value : '').trim();
    if (!essay) { App.toast('请先粘贴作文'); return; }
    if (essay.length < 20) { App.toast('作文内容太短，请粘贴完整作文'); return; }

    // 检查 WebGPU 支持
    if (typeof navigator === 'undefined' || !navigator.gpu) {
      this._showAiError('当前浏览器不支持 WebGPU，无法本地运行模型。请使用最新版桌面 Chrome / Edge 浏览器，并确认已开启硬件加速。');
      return;
    }

    const btn = document.getElementById('aiGradeBtn');
    const progEl = document.getElementById('aiProgress');
    const resultEl = document.getElementById('aiResult');
    if (btn) { btn.disabled = true; btn.textContent = '批改中...'; }
    if (resultEl) resultEl.innerHTML = '';

    try {
      // 1. 加载 WebLLM 库
      this._aiProgress(progEl, 2, '正在加载 AI 引擎...');
      const webllm = await window.__loadWebLLM();

      // 2. 创建/复用引擎
      if (!_aiEngine || _aiEngineModel !== AI_MODEL_ID) {
        this._aiProgress(progEl, 5, '正在下载模型（首次约 1-2GB，请耐心等待）...');
        const prebuilt = webllm.prebuiltAppConfig || { model_list: [] };
        const cfg = JSON.parse(JSON.stringify(prebuilt));
        const entry = (cfg.model_list || []).find(m => m.model_id === AI_MODEL_ID);
        if (entry) {
          entry.model = AI_MODEL_BASE;
          entry.model_lib = AI_MODEL_BASE + AI_MODEL_ID + '-webgpu.wasm';
        }
        _aiEngine = await webllm.CreateMLCEngine(AI_MODEL_ID, {
          appConfig: cfg,
          initProgressCallback: (p) => {
            const pct = Math.round((p.progress || 0) * 100);
            this._aiProgress(progEl, pct, (p.text || '正在下载模型') + ' · ' + pct + '%');
          },
        });
        _aiEngineModel = AI_MODEL_ID;
      }

      // 3. 批改（流式）
      this._aiProgress(progEl, 100, '模型已就绪，正在批改作文...');
      const messages = [
        { role: 'system', content: AI_SYSTEM_PROMPT },
        { role: 'user', content: '请批改下面这篇学生作文：\n\n' + essay },
      ];
      const chunks = await _aiEngine.chat.completions.create({
        messages,
        temperature: 0.7,
        max_tokens: 2048,
        stream: true,
      });

      resultEl.innerHTML = '<div class="card"><div class="card-title">✍️ 批改结果</div><div id="aiReplyText" style="font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word"></div></div>';
      const replyEl = document.getElementById('aiReplyText');
      let reply = '';
      for await (const chunk of chunks) {
        reply += (chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content) || '';
        if (replyEl) replyEl.textContent = reply;
      }
      if (progEl) progEl.style.display = 'none';
      App._aiLast = { content: essay, reply };
      if (resultEl) {
        resultEl.insertAdjacentHTML('beforeend', '<div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary btn-block" onclick="App.essayAiSave()">💾 保存到草稿箱</button></div>');
      }
      App.toast('批改完成');
    } catch (e) {
      console.warn('AI 批改失败', e);
      this._showAiError('AI 批改失败：' + (e && e.message ? e.message : '未知错误') + '。可能是模型下载被网络中断，请稍后重试（已下载部分会缓存）。');

      if (btn) { btn.disabled = false; btn.textContent = '🚀 开始批改'; }
    }

  checkWordAnswer(el, userIndex, correctIndex) {
    const g = App.wordGame;
    if (!g) return;
    const isCorrect = userIndex === correctIndex;
    // 禁用所有选项，防止重复点击
    document.querySelectorAll('#mainContent .quiz-option').forEach(o => o.style.pointerEvents = 'none');
    // 高亮正确答案；答错时高亮用户所选
    document.querySelectorAll('#mainContent .quiz-option').forEach((o, i) => {
      if (i === correctIndex) o.classList.add('correct');
      else if (i === userIndex && !isCorrect) o.classList.add('wrong');
    });
    if (isCorrect) g.correct++;
    // 记录学习进度
    const stats = DB.get('studyStats');
    stats.wordProgress.learned = Math.min(stats.wordProgress.learned + 1, stats.wordProgress.total);
    DB.set('studyStats', stats);
    // 显示反馈 + 下一题按钮
    const resultEl = document.getElementById('wordResult');
    const textEl = document.getElementById('wordResultText');
    if (resultEl) resultEl.style.display = '';
    if (textEl) {
      textEl.textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
      textEl.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
    }
